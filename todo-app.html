<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Lista de Tarefas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      color: #999;
      font-size: 14px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .input-group button {
      padding: 12px 25px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .input-group button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .input-group button:active {
      transform: translateY(0);
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: #667eea;
    }

    .filter-btn:hover:not(.active) {
      border-color: #667eea;
      color: #667eea;
    }

    .todo-list {
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
    }

    .todo-list::-webkit-scrollbar {
      width: 6px;
    }

    .todo-list::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    .todo-list::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: all 0.3s;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .todo-item:hover {
      background: #f0f0f0;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #999;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .todo-text {
      flex: 1;
      font-size: 16px;
      color: #333;
      word-break: break-word;
    }

    .todo-priority {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .priority-high {
      background: #ffebee;
      color: #c62828;
    }

    .priority-medium {
      background: #fff3e0;
      color: #e65100;
    }

    .priority-low {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .delete-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    .delete-btn:hover {
      background: #ff5252;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      padding: 15px 0;
      border-top: 2px solid #e0e0e0;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 20px;
      font-weight: bold;
      color: #667eea;
      display: block;
    }

    .clear-all-btn {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #f5f5f5;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      color: #ff6b6b;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .clear-all-btn:hover {
      background: #ffe0e0;
      border-color: #ff6b6b;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .input-group {
        flex-direction: column;
      }

      .input-group button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 Minhas Tarefas</h1>
      <p>Organize sua rotina de forma simples e eficaz</p>
    </div>

    <div class="input-group">
      <input
        type="text"
        id="todoInput"
        placeholder="Adicione uma nova tarefa..."
        autocomplete="off"
      />
      <select id="prioritySelect" style="padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer;">
        <option value="low">Baixa</option>
        <option value="medium" selected>Média</option>
        <option value="high">Alta</option>
      </select>
      <button onclick="addTodo()">Adicionar</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="filterTodos('all')">Todas</button>
      <button class="filter-btn" onclick="filterTodos('active')">Ativas</button>
      <button class="filter-btn" onclick="filterTodos('completed')">Concluídas</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>

    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-state-icon">✨</div>
      <p>Nenhuma tarefa por aqui!</p>
      <p style="font-size: 12px; margin-top: 5px;">Crie uma nova para começar</p>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-number" id="totalCount">0</span>
        <span>Total</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="activeCount">0</span>
        <span>Ativas</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="completedCount">0</span>
        <span>Concluídas</span>
      </div>
    </div>

    <button class="clear-all-btn" onclick="clearCompleted()">Limpar Concluídas</button>
  </div>

  <script>
    let todos = [];
    let currentFilter = 'all';

    // Load todos from localStorage
    function loadTodos() {
      const saved = localStorage.getItem('todos');
      todos = saved ? JSON.parse(saved) : [];
      renderTodos();
      updateStats();
    }

    // Save todos to localStorage
    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
      updateStats();
    }

    // Add new todo
    function addTodo() {
      const input = document.getElementById('todoInput');
      const priority = document.getElementById('prioritySelect').value;
      const text = input.value.trim();

      if (text === '') {
        alert('Por favor, digite uma tarefa!');
        return;
      }

      const newTodo = {
        id: Date.now(),
        text: text,
        completed: false,
        priority: priority,
        createdAt: new Date().toLocaleString('pt-BR')
      };

      todos.unshift(newTodo);
      input.value = '';
      input.focus();
      saveTodos();
      renderTodos();
    }

    // Toggle todo completion
    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        saveTodos();
        renderTodos();
      }
    }

    // Delete todo
    function deleteTodo(id) {
      if (confirm('Tem certeza que deseja deletar esta tarefa?')) {
        todos = todos.filter(t => t.id !== id);
        saveTodos();
        renderTodos();
      }
    }

    // Filter todos
    function filterTodos(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      renderTodos();
    }

    // Clear completed todos
    function clearCompleted() {
      const completedCount = todos.filter(t => t.completed).length;
      if (completedCount === 0) {
        alert('Não há tarefas concluídas para limpar!');
        return;
      }
      if (confirm(`Deseja deletar ${completedCount} tarefa(s) concluída(s)?`)) {
        todos = todos.filter(t => !t.completed);
        saveTodos();
        currentFilter = 'all';
        document.querySelectorAll('.filter-btn')[0].classList.add('active');
        document.querySelectorAll('.filter-btn').forEach((btn, idx) => {
          if (idx !== 0) btn.classList.remove('active');
        });
        renderTodos();
      }
    }

    // Render todos
    function renderTodos() {
      const list = document.getElementById('todoList');
      const emptyState = document.getElementById('emptyState');
      list.innerHTML = '';

      let filtered = todos;
      if (currentFilter === 'active') {
        filtered = todos.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        filtered = todos.filter(t => t.completed);
      }

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
        list.style.minHeight = '200px';
      } else {
        emptyState.style.display = 'none';
        list.style.minHeight = 'auto';
      }

      filtered.forEach(todo => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <input 
            type="checkbox" 
            class="checkbox" 
            ${todo.completed ? 'checked' : ''} 
            onchange="toggleTodo(${todo.id})"
          />
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <span class="todo-priority priority-${todo.priority}">
            ${getPriorityLabel(todo.priority)}
          </span>
          <button class="delete-btn" onclick="deleteTodo(${todo.id})">Deletar</button>
        `;
        list.appendChild(li);
      });
    }

    // Update statistics
    function updateStats() {
      const total = todos.length;
      const active = todos.filter(t => !t.completed).length;
      const completed = todos.filter(t => t.completed).length;

      document.getElementById('totalCount').textContent = total;
      document.getElementById('activeCount').textContent = active;
      document.getElementById('completedCount').textContent = completed;
    }

    // Helper function to escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Helper function to get priority label
    function getPriorityLabel(priority) {
      const labels = {
        low: 'Baixa',
        medium: 'Média',
        high: 'Alta'
      };
      return labels[priority] || 'Média';
    }

    // Allow adding todo with Enter key
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('todoInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          addTodo();
        }
      });
      loadTodos();
    });
  </script>
</body>
</html>
